<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Vault - ESP32</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .nav-link { color: #4CAF50; text-decoration: none; font-size: 16px; align-self: center; }
        .video-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .video-card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; border-top: 3px solid #2196F3; }
        video { width: 320px; border-radius: 5px; outline: none; }
        .timestamp { margin-top: 0; font-size: 14px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>
        Your Cloud Vault (Max 10)
        <a href="index.html" class="nav-link">← Back to Dashboard</a>
    </h1>
    <div class="video-grid" id="vault-gallery"></div>

    <script>
        const currentUsername = localStorage.getItem('username');
        if (!currentUsername) window.location.href = 'login.html';

        // Fetch all videos, but filter for ONLY cloud saved ones
        fetch(`/api/videos/?user=${currentUsername}`)
            .then(response => response.json())
            .then(data => {
                const gallery = document.getElementById('vault-gallery');
                
                // Filter the array to only keep videos saved to the vault
                const vaultVideos = data.videos.filter(v => v.is_cloud_saved === true);

                if (vaultVideos.length === 0) {
                    gallery.innerHTML = "<p style='color: #888;'>Your vault is currently empty.</p>";
                    return;
                }

                vaultVideos.forEach(video => {
                    const fullVideoUrl = video.url;
                    // Grab just the filename from the URL for the delete prompt
                    const fileName = video.url.split('/').pop(); 
                    
                    gallery.innerHTML += `
                        <div class="video-card">
                            <p class="timestamp">Captured: ${video.timestamp}</p>
                            <video controls preload="metadata">
                                <source src="${fullVideoUrl}" type="video/mp4">
                            </video>
                            <button onclick="deleteVideo(${video.id}, '${fileName}')" style="margin-top: 10px; width: 100%; padding: 8px; background-color: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                🗑️ Delete Permanently
                            </button>
                        </div>
                    `;
                });
            })
            .catch(error => console.error('Error fetching vault:', error));

        function deleteVideo(videoId, videoName) {
            // THE STRICT FAILSAFE MODAL
            const userConfirmed = confirm(`Are you sure you want to delete ${videoName}?`);
            
            if (userConfirmed) {
                fetch(`/api/vault/delete/${videoId}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        location.reload(); // Refresh to remove the video from the screen
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }
    </script>
</body>
</html>
