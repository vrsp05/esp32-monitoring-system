<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - MiniSentinel.io</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; display: flex; min-height: 100vh; }
        
        .sidebar { width: 250px; background-color: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #334155; }
        .sidebar h2 { color: #38bdf8; margin-top: 0; font-size: 24px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .sidebar a:hover { background-color: #334155; color: #ffffff; }
        .sidebar a.active { background-color: #38bdf8; color: #0f172a; }
        .logout-btn { margin-top: auto; padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        h1 { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
        
        .device-card { background-color: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        .device-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
        .device-info p { margin: 5px 0; color: #94a3b8; }
        .device-info span { color: #e2e8f0; font-family: monospace; }
        
        .btn-add { background-color: #4ade80; color: #0f172a; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-copy { background-color: #38bdf8; color: #0f172a; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px;}
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #334155; padding: 15px; }
            .main-content { padding: 15px; }
            h1 { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MiniSentinel.io</h2>
        <a href="index.html">Dashboard</a>
        <a href="devices.html" class="active">Devices</a>
        <a href="vault.html">Vault</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-content">
        <h1>
            Your Devices
            <button class="btn-add" onclick="generateDeviceID()">+ Add New Device</button>
        </h1>
        <div id="device-list">
            <p style="color: #94a3b8;">Loading devices...</p>
        </div>
    </div>

    <script>
        const currentUsername = localStorage.getItem('username');
        if (!currentUsername) window.location.href = 'login.html';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function loadDevices() {
            fetch(`/api/devices/?user=${currentUsername}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('device-list');
                    container.innerHTML = ""; 

                    if (data.devices.length === 0) {
                        container.innerHTML = "<p style='color: #94a3b8;'>No devices registered yet.</p>";
                        return;
                    }

                    data.devices.forEach(device => {
                        container.innerHTML += `
                            <div class="device-card">
                                <div class="device-header">
                                    <h3 style="margin: 0; color: #38bdf8;">${device.name}</h3>
                                    <button class="btn-delete" onclick="deleteDevice('${device.id}')">Delete Device</button>
                                </div>
                                <div class="device-info">
                                    <p><strong>Device ID:</strong> <span>${device.device_id}</span> <button class="btn-copy" onclick="copyId('${device.device_id}')">Copy</button></p>
                                    <p><strong>Status:</strong> ${device.status}</p>
                                    <p><strong>Date Added:</strong> ${device.date_added}</p>
                                    <p><strong>Videos Uploaded:</strong> ${device.video_count}</p>
                                    <p><strong>Storage Space:</strong> ${device.storage_space}</p>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(error => console.error('Error fetching devices:', error));
        }

        function generateDeviceID() {
            fetch('/api/camera/create/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadDevices(); 
                } else {
                    alert(data.message);
                }
            });
        }

        function deleteDevice(deviceId) {
            if (confirm("Are you sure you want to delete this device? Your captured videos will remain safely stored.")) {
                fetch(`/api/camera/delete/${deviceId}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') loadDevices();
                    else alert(data.message);
                });
            }
        }

        function copyId(id) {
            navigator.clipboard.writeText(id).then(() => alert("Device ID copied to clipboard!"));
        }

        // Fetch the devices on load
        loadDevices();
    </script>
</body>
</html>
