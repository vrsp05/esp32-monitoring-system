<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - MiniSentinel.io</title>
    <!-- THEME LOADER -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <style>
        /* Universal Light Earth Green Palette */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f4; color: #1f2937; margin: 0; display: flex; min-height: 100vh; }

        /* Dashboard Navigation */
        .sidebar { width: 250px; background-color: #ffffff; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #c8d6c6; box-shadow: 2px 0 5px rgba(0,0,0,0.02); }
        .sidebar h2 { color: #2e7d32; margin-top: 0; font-size: 24px; border-bottom: 2px solid #e8ede6; padding-bottom: 15px; }
        .sidebar a { color: #4b5563; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .sidebar a:hover { background-color: #e8ede6; color: #1b5e20; }
        .sidebar a.active { background-color: #2e7d32; color: #ffffff; }
        .logout-btn { margin-top: auto; padding: 10px; background-color: #d32f2f; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Layout & Typography */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        h1, h2, h3 { color: #1b5e20; }
        h1 { border-bottom: 2px solid #c8d6c6; padding-bottom: 10px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .timestamp { margin-top: 0; font-size: 14px; color: #4b5563; margin-bottom: 10px; font-weight: bold; }

        /* Content Cards */
        .video-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .video-card, .device-card { background-color: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #c8d6c6; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .video-card { border-top: 4px solid #4caf50; }
        .device-card { margin-bottom: 15px; }
        .device-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8ede6; padding-bottom: 10px; margin-bottom: 15px; }
        .device-info p { margin: 5px 0; color: #4b5563; }
        .device-info span { color: #1f2937; font-family: monospace; font-weight: bold; }

        /* Buttons & Inputs */
        button { transition: background 0.2s; }
        .btn-add, .login-box button { background-color: #2e7d32; color: white; border: none; padding: 10px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-add:hover, .login-box button:hover { background-color: #1b5e20; }
        .btn-delete { background-color: #ef5350; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-copy { background-color: #a5d6a7; color: #1b5e20; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px;}
        video { width: 320px; border-radius: 5px; outline: none; background: #000; border: 1px solid #c8d6c6; }

        /* Auth Pages (Login/Signup) */
        .login-box { background-color: #ffffff; padding: 40px; border-radius: 8px; border: 1px solid #c8d6c6; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #c8d6c6; border-radius: 5px; background-color: #f9faf9; color: #1f2937; box-sizing: border-box; }
        .link { margin-top: 20px; display: block; color: #2e7d32; text-decoration: none; font-size: 14px; font-weight: bold; }
        .msg { margin-top: 10px; font-size: 14px; display: none; }
        .error { color: #d32f2f; }
        .success { color: #2e7d32; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #c8d6c6; padding: 15px; }
            .main-content { padding: 15px; }
            h1 { flex-direction: column; align-items: flex-start; gap: 10px; }
            video { width: 100%; }
        }

        /* --- DARK MODE OVERRIDES --- */
        html.dark-mode body { background-color: #0f172a; color: #e2e8f0; }
        html.dark-mode .sidebar, html.dark-mode .settings-card, html.dark-mode .video-card, html.dark-mode .device-card, html.dark-mode .profile-card, html.dark-mode .login-box { background-color: #1e293b; border-color: #334155; box-shadow: none; }
        html.dark-mode h1, html.dark-mode h2, html.dark-mode h3 { color: #38bdf8; border-color: #334155; }
        html.dark-mode .sidebar h2 { border-color: #334155; }
        html.dark-mode .sidebar a { color: #94a3b8; }
        html.dark-mode .sidebar a:hover { background-color: #334155; color: #ffffff; }
        html.dark-mode .sidebar a.active { background-color: #38bdf8; color: #0f172a; }
        html.dark-mode input, html.dark-mode #display-username { background-color: #0f172a; color: white; border-color: #334155; }
        html.dark-mode .timestamp, html.dark-mode .device-info p, html.dark-mode label, html.dark-mode .setting-row p { color: #94a3b8; }
        html.dark-mode .device-info span { color: #e2e8f0; }
        html.dark-mode .video-card { border-top-color: #38bdf8; }
        html.dark-mode .danger-zone { background-color: #450a0a; border-color: #7f1d1d; }
        html.dark-mode .danger-zone h3 { border-color: #7f1d1d; }
        html.dark-mode .btn-toggle { background-color: #38bdf8; color: #0f172a; }
        html.dark-mode .btn-toggle:hover { background-color: #0ea5e9; }

    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MiniSentinel.io</h2>
        <a href="index.html">Dashboard</a>
        <a href="devices.html" class="active">Devices</a>
        <a href="vault.html">Vault</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-content">
        <h1>
            Your Devices
            <button class="btn-add" onclick="generateDeviceID()">+ Add New Device</button>
        </h1>
        <div id="device-list">
            <p style="color: #94a3b8;">Loading devices...</p>
        </div>
    </div>

    <script>
        const currentUsername = localStorage.getItem('username');
        if (!currentUsername) window.location.href = 'login.html';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function loadDevices() {
            fetch(`/api/devices/?user=${currentUsername}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('device-list');
                    container.innerHTML = ""; 

                    if (data.devices.length === 0) {
                        container.innerHTML = "<p style='color: #94a3b8;'>No devices registered yet.</p>";
                        return;
                    }

                    data.devices.forEach(device => {
                        container.innerHTML += `
                            <div class="device-card">
                                <div class="device-header">
                                    <h3 style="margin: 0; color: #38bdf8;">
                                        ${device.name} 
                                        <button onclick="renameDevice('${device.id}', '${device.name}')" style="background-color: #f59e0b; color: #0f172a; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px; font-size: 12px;">
                                            ✏️ Edit
                                        </button>
                                    </h3>
                                    <button class="btn-delete" onclick="deleteDevice('${device.id}')">Delete Device</button>
                                </div>
                                <div class="device-info">
                                    <p><strong>Device ID:</strong> <span>${device.device_id}</span> <button class="btn-copy" onclick="copyId('${device.device_id}')">Copy</button></p>
                                    <p><strong>Status:</strong> ${device.status}</p>
                                    <p><strong>Date Added:</strong> ${device.date_added}</p>
                                    <p><strong>Videos Uploaded:</strong> ${device.video_count}</p>
                                    <p><strong>Storage Space:</strong> ${device.storage_space}</p>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(error => console.error('Error fetching devices:', error));
        }

        function generateDeviceID() {
            fetch('/api/camera/create/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadDevices(); 
                } else {
                    alert(data.message);
                }
            });
        }

        function deleteDevice(deviceId) {
            if (confirm("Are you sure you want to delete this device? Your captured videos will remain safely stored.")) {
                fetch(`/api/camera/delete/${deviceId}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') loadDevices();
                    else alert(data.message);
                });
            }
        }

        function renameDevice(deviceId, currentName) {
            const newName = prompt("Enter a new name for this camera:", currentName);
            
            if (newName && newName.trim() !== "" && newName !== currentName) {
                fetch(`/api/camera/rename/${deviceId}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUsername, 
                        new_name: newName.trim() 
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') loadDevices();
                    else alert(data.message);
                })
                .catch(error => console.error('Error renaming device:', error));
            }
        }

        function copyId(id) {
            navigator.clipboard.writeText(id).then(() => alert("Device ID copied to clipboard!"));
        }

        // Fetch the devices on load
        loadDevices();
    </script>
</body>
</html>
