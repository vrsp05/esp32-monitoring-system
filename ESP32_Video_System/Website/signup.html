<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MiniSentinel.io</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #1e293b; padding: 40px; border-radius: 8px; border: 1px solid #334155; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #f8fafc; margin-top: 0; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 5px; background-color: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; transition: background 0.2s; }
        button:hover { background-color: #0284c7; }
        .link { margin-top: 20px; display: block; color: #4ade80; text-decoration: none; font-size: 14px; }
        .msg { margin-top: 10px; font-size: 14px; display: none; }
        .error { color: #ef4444; }
        .success { color: #4ade80; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Create Account</h2>
        <input type="text" id="username" placeholder="Choose a Username" required>
        <input type="password" id="password" placeholder="Create a Password" required>
        <button onclick="attemptSignup()">Sign Up</button>
        <p id="message" class="msg"></p>
        <a href="login.html" class="link">Already have an account? Log in</a>
    </div>

    <script>
        document.getElementById('password').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                attemptSignup();
            }
        });

        function attemptSignup() {
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const msgText = document.getElementById('message');

            if (!userVal || !passVal) {
                msgText.innerText = "Please fill out both fields.";
                msgText.className = "msg error";
                msgText.style.display = "block";
                return;
            }

            msgText.style.display = "none";

            fetch('/api/signup/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: userVal, password: passVal })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    msgText.innerText = "Account created! Redirecting...";
                    msgText.className = "msg success";
                    msgText.style.display = "block";
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    msgText.innerText = data.message;
                    msgText.className = "msg error";
                    msgText.style.display = "block";
                }
            })
            .catch(error => {
                msgText.innerText = "Network error connecting to the server.";
                msgText.className = "msg error";
                msgText.style.display = "block";
            });
        }
    </script>
</body>
</html>
