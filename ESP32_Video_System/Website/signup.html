<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ESP32 Video Vault</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background-color: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background-color: #2a2a2a; color: white; }
        button { width: 100%; padding: 10px; background-color: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1e88e5; }
        a { color: #2196F3; text-decoration: none; font-size: 14px; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Create Account</h2>
        <input type="text" id="username" placeholder="Choose a Username" required>
        <input type="password" id="password" placeholder="Create a Password" required>
        <button onclick="attemptSignup()">Sign Up</button>
        <p id="message" style="color: #ff4c4c; font-size: 14px;"></p>
        <a href="login.html">Already have an account? Log in</a>
    </div>

    <script>
        function attemptSignup() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            fetch('http://127.0.0.1:8000/api/signup/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('message').style.color = "#4CAF50";
                    document.getElementById('message').innerText = "Account created! Redirecting...";
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    document.getElementById('message').innerText = data.message;
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
