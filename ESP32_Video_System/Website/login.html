<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MiniSentinel.io</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #1e293b; padding: 40px; border-radius: 8px; border: 1px solid #334155; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #f8fafc; margin-top: 0; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 5px; background-color: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #4ade80; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; transition: background 0.2s; }
        button:hover { background-color: #22c55e; }
        .link { margin-top: 20px; display: block; color: #38bdf8; text-decoration: none; font-size: 14px; }
        .error-msg { color: #ef4444; margin-top: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>MiniSentinel.io Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="attemptLogin()">Login</button>
        <p id="error-text" class="error-msg"></p>
        <a href="signup.html" class="link">Don't have an account? Sign up</a>
    </div>

    <script>
        // Target the Enter key specifically on the password field
        document.getElementById('password').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                attemptLogin();
            }
        });

        function attemptLogin() {
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const errorText = document.getElementById('error-text');

            if (!userVal || !passVal) {
                errorText.innerText = "Please enter both username and password.";
                errorText.style.display = "block";
                return;
            }

            errorText.style.display = "none";

            fetch('/api/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: userVal, password: passVal })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('device_id', data.device_id);
                    window.location.href = 'index.html';
                } else {
                    errorText.innerText = data.message;
                    errorText.style.display = "block";
                }
            })
            .catch(error => {
                errorText.innerText = "Network error connecting to the server.";
                errorText.style.display = "block";
            });
        }
    </script>
</body>
</html>
