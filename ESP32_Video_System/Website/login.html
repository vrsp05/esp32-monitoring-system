<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ESP32 Video Vault</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background-color: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background-color: #2a2a2a; color: white; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #45a049; }
        a { color: #4CAF50; text-decoration: none; font-size: 14px; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Vault Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="attemptLogin()">Login</button>
        <p id="message" style="color: #ff4c4c; font-size: 14px;"></p>
        <a href="signup.html">Don't have an account? Sign up</a>
    </div>

    <script>
        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            fetch('/api/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Save the user's info to the browser's local storage
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('device_id', data.device_id);
                    
                    window.location.href = 'index.html'; // Send to dashboard!
                } else {
                    document.getElementById('message').innerText = data.message;
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
