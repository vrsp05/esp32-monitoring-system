<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSentinel.io</title>
    <style>
        /* Soft, modern slate color palette */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; display: flex; min-height: 100vh; }
        
        /* Responsive Side Navigation */
        .sidebar { width: 250px; background-color: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #334155; }
        .sidebar h2 { color: #38bdf8; margin-top: 0; font-size: 24px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .sidebar a:hover { background-color: #334155; color: #ffffff; }
        .sidebar a.active { background-color: #38bdf8; color: #0f172a; }
        .logout-btn { margin-top: auto; padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* Main Dashboard Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        h1 { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; color: #f8fafc; }
        .video-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .video-card { background-color: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        video { width: 320px; border-radius: 5px; outline: none; background: #000; }
        
        /* Mobile Phone Responsiveness */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #334155; padding: 15px; }
            .main-content { padding: 15px; }
            video { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MiniSentinel.io</h2>
        <a href="index.html" class="active">Dashboard</a>
        <a href="#">Devices</a>
        <a href="vault.html">Vault</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-content">
        <h1>Dashboard</h1>
        <div class="video-grid" id="gallery"></div>
    </div>

    <script>
        // 1. Pull the user's info from local storage FIRST
        const currentUsername = localStorage.getItem('username');
        const currentDeviceId = localStorage.getItem('device_id');

        // If they aren't logged in, kick them back to the login screen
        if (!currentUsername) {
            window.location.href = 'login.html';
        }

        // Inject their actual Device ID into the green code block
        // 1. Show the ID if it exists, otherwise show a Generate button
        if (!currentDeviceId || currentDeviceId === "null" || currentDeviceId === "undefined" || currentDeviceId === "No Camera Registered") {
            document.getElementById('device-id').innerHTML = `<button onclick="generateDeviceID()" style="padding: 8px 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Generate Device ID</button>`;
        } else {
            document.getElementById('device-id').innerText = currentDeviceId;
        }

        // 2. The function to call your new API endpoint
        function generateDeviceID() {
            fetch('/api/camera/create/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Save the new ID to the browser and instantly refresh the page
                    localStorage.setItem('device_id', data.device_id);
                    location.reload(); 
                } else {
                    alert(data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        }
        
        function copyToClipboard() {
            const idText = document.getElementById("device-id").innerText;
            navigator.clipboard.writeText(idText).then(() => {
                alert("Device ID copied to clipboard!");
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }

        function saveVideo(videoId) {
            fetch(`/api/vault/save/${videoId}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message); // Will show success, or "Vault is full!" error
                if(data.status === 'success') {
                    location.reload(); // Refresh the page to update the button color
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // --- LOGOUT LOGIC ---
        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('device_id');
            window.location.href = 'login.html';
        }

        // --- DOWNLOAD LOGIC ---
        function downloadVideo(url, filename) {
            // Fetch the video file as a "blob" (raw data) to force the browser to download it
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click(); // Simulate a click on the hidden link
                    a.remove();
                    window.URL.revokeObjectURL(blobUrl); // Clean up browser memory
                })
                .catch(error => console.error('Download error:', error));
        }

        let currentPage = 1;
        const videosPerPage = 5;

        function loadVideos() {
            fetch(`/api/videos/?user=${currentUsername}`)
                .then(response => response.json())
                .then(data => {
                    const gallery = document.getElementById('gallery');
                    gallery.innerHTML = ""; // Clear the old videos before loading the new ones
                    
                    // 1. Calculate pagination bounds
                    const totalVideos = data.videos.length;
                    const totalPages = Math.ceil(totalVideos / videosPerPage);
                    const startIndex = (currentPage - 1) * videosPerPage;
                    const endIndex = startIndex + videosPerPage;
                    
                    // 2. Slice the array to only grab 5 videos
                    const pageVideos = data.videos.slice(startIndex, endIndex);
                    
                    // 3. Render only the sliced videos
                    pageVideos.forEach(video => {
                        const fullVideoUrl = video.url;
                        const vaultBtnText = video.is_cloud_saved ? "🔒 Saved to Vault" : "💾 Save to Vault";
                        const vaultBtnDisabled = video.is_cloud_saved ? "disabled" : "";
                        const btnColor = video.is_cloud_saved ? "#555" : "#2196F3";
                        const fileName = video.url.split('/').pop(); 

                        gallery.innerHTML += `
                            <div class="video-card">
                                <p class="timestamp">Captured: ${video.timestamp}</p>
                                <video controls preload="metadata">
                                    <source src="${fullVideoUrl}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                
                                <div style="display: flex; gap: 10px; margin-top: 10px;">
                                    <button onclick="downloadVideo('${fullVideoUrl}', '${fileName}')" style="flex: 1; padding: 8px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                        ⬇️ Download
                                    </button>
                                    <button ${vaultBtnDisabled} onclick="saveVideo(${video.id})" style="flex: 1; padding: 8px; background-color: ${btnColor}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                        ${vaultBtnText}
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    // 4. Inject Pagination Controls at the bottom
                    gallery.innerHTML += `
                        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 10px; background-color: #1e1e1e; border-radius: 8px; border: 1px solid #333;">
                            <button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(-1)" style="padding: 10px 20px; background-color: ${currentPage === 1 ? '#555' : '#2196F3'}; color: white; border: none; border-radius: 5px; cursor: ${currentPage === 1 ? 'not-allowed' : 'pointer'}; font-weight: bold;">
                                ← Previous
                            </button>
                            <span style="font-weight: bold;">Page ${currentPage} of ${totalPages || 1}</span>
                            <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(1)" style="padding: 10px 20px; background-color: ${currentPage >= totalPages ? '#555' : '#2196F3'}; color: white; border: none; border-radius: 5px; cursor: ${currentPage >= totalPages ? 'not-allowed' : 'pointer'}; font-weight: bold;">
                                Next →
                            </button>
                        </div>
                    `;
                })
                .catch(error => console.error('Error fetching videos:', error));
        }

        // 5. Helper function to flip pages
        function changePage(direction) {
            currentPage += direction;
            loadVideos();
        }

    // 6. Load videos immediately when the page opens
    loadVideos();

    // Automatically reload the videos every 15 seconds
    setInterval(loadVideos, 15000);
    </script>

</body>
</html>
