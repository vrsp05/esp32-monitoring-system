<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSentinel.io</title>
    <style>
        /* Universal Light Earth Green Palette */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f4; color: #1f2937; margin: 0; display: flex; min-height: 100vh; }

        /* Dashboard Navigation */
        .sidebar { width: 250px; background-color: #ffffff; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #c8d6c6; box-shadow: 2px 0 5px rgba(0,0,0,0.02); }
        .sidebar h2 { color: #2e7d32; margin-top: 0; font-size: 24px; border-bottom: 2px solid #e8ede6; padding-bottom: 15px; }
        .sidebar a { color: #4b5563; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .sidebar a:hover { background-color: #e8ede6; color: #1b5e20; }
        .sidebar a.active { background-color: #2e7d32; color: #ffffff; }
        .logout-btn { margin-top: auto; padding: 10px; background-color: #d32f2f; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Layout & Typography */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        h1, h2, h3 { color: #1b5e20; }
        h1 { border-bottom: 2px solid #c8d6c6; padding-bottom: 10px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .timestamp { margin-top: 0; font-size: 14px; color: #4b5563; margin-bottom: 10px; font-weight: bold; }

        /* Content Cards */
        .video-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .video-card, .device-card { background-color: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #c8d6c6; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .video-card { border-top: 4px solid #4caf50; }
        .device-card { margin-bottom: 15px; }
        .device-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8ede6; padding-bottom: 10px; margin-bottom: 15px; }
        .device-info p { margin: 5px 0; color: #4b5563; }
        .device-info span { color: #1f2937; font-family: monospace; font-weight: bold; }

        /* Buttons & Inputs */
        button { transition: background 0.2s; }
        .btn-add, .login-box button { background-color: #2e7d32; color: white; border: none; padding: 10px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-add:hover, .login-box button:hover { background-color: #1b5e20; }
        .btn-delete { background-color: #ef5350; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-copy { background-color: #a5d6a7; color: #1b5e20; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px;}
        video { width: 320px; border-radius: 5px; outline: none; background: #000; border: 1px solid #c8d6c6; }

        /* Auth Pages (Login/Signup) */
        .login-box { background-color: #ffffff; padding: 40px; border-radius: 8px; border: 1px solid #c8d6c6; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #c8d6c6; border-radius: 5px; background-color: #f9faf9; color: #1f2937; box-sizing: border-box; }
        .link { margin-top: 20px; display: block; color: #2e7d32; text-decoration: none; font-size: 14px; font-weight: bold; }
        .msg { margin-top: 10px; font-size: 14px; display: none; }
        .error { color: #d32f2f; }
        .success { color: #2e7d32; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #c8d6c6; padding: 15px; }
            .main-content { padding: 15px; }
            h1 { flex-direction: column; align-items: flex-start; gap: 10px; }
            video { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MiniSentinel.io</h2>
        <a href="index.html" class="active">Dashboard</a>
        <a href="devices.html">Devices</a>
        <a href="vault.html">Vault</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-content">
        <h1>Dashboard</h1>
        <div class="video-grid" id="gallery"></div>
    </div>

    <script>
        // 1. Pull the user's info from local storage FIRST
        const currentUsername = localStorage.getItem('username');
        const currentDeviceId = localStorage.getItem('device_id');

        // If they aren't logged in, kick them back to the login screen
        if (!currentUsername) {
            window.location.href = 'login.html';
        }

        function saveVideo(videoId) {
            fetch(`/api/vault/save/${videoId}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUsername })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message); // Will show success, or "Vault is full!" error
                if(data.status === 'success') {
                    location.reload(); // Refresh the page to update the button color
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // --- LOGOUT LOGIC ---
        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('device_id');
            window.location.href = 'login.html';
        }

        // --- DOWNLOAD LOGIC ---
        function downloadVideo(url, filename) {
            // Fetch the video file as a "blob" (raw data) to force the browser to download it
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click(); // Simulate a click on the hidden link
                    a.remove();
                    window.URL.revokeObjectURL(blobUrl); // Clean up browser memory
                })
                .catch(error => console.error('Download error:', error));
        }

        let currentPage = 1;
        const videosPerPage = 4;

        function loadVideos() {
            fetch(`/api/videos/?user=${currentUsername}`)
                .then(response => response.json())
                .then(data => {
                    const gallery = document.getElementById('gallery');
                    gallery.innerHTML = ""; // Clear the old videos before loading the new ones
                    
                    // 1. Calculate pagination bounds
                    const totalVideos = data.videos.length;
                    const totalPages = Math.ceil(totalVideos / videosPerPage);
                    const startIndex = (currentPage - 1) * videosPerPage;
                    const endIndex = startIndex + videosPerPage;
                    
                    // 2. Slice the array to only grab 5 videos
                    const pageVideos = data.videos.slice(startIndex, endIndex);
                    
                    // 3. Render only the sliced videos
                    pageVideos.forEach(video => {
                        const fullVideoUrl = video.url;
                        const vaultBtnText = video.is_cloud_saved ? "🔒 Saved to Vault" : "💾 Save to Vault";
                        const vaultBtnDisabled = video.is_cloud_saved ? "disabled" : "";
                        const btnColor = video.is_cloud_saved ? "#555" : "#2196F3";
                        const fileName = video.url.split('/').pop(); 

                        gallery.innerHTML += `
                            <div class="video-card">
                                <p class="timestamp">Captured: ${video.timestamp}</p>
                                <video controls preload="metadata">
                                    <source src="${fullVideoUrl}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                
                                <div style="display: flex; gap: 10px; margin-top: 10px;">
                                    <button onclick="downloadVideo('${fullVideoUrl}', '${fileName}')" style="flex: 1; padding: 8px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                        ⬇️ Download
                                    </button>
                                    <button ${vaultBtnDisabled} onclick="saveVideo(${video.id})" style="flex: 1; padding: 8px; background-color: ${btnColor}; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                        ${vaultBtnText}
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    // 4. Inject Pagination Controls at the bottom
                    gallery.innerHTML += `
                        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 10px; background-color: #1e1e1e; border-radius: 8px; border: 1px solid #333;">
                            <button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(-1)" style="padding: 10px 20px; background-color: ${currentPage === 1 ? '#555' : '#2196F3'}; color: white; border: none; border-radius: 5px; cursor: ${currentPage === 1 ? 'not-allowed' : 'pointer'}; font-weight: bold;">
                                ← Previous
                            </button>
                            <span style="font-weight: bold;">Page ${currentPage} of ${totalPages || 1}</span>
                            <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(1)" style="padding: 10px 20px; background-color: ${currentPage >= totalPages ? '#555' : '#2196F3'}; color: white; border: none; border-radius: 5px; cursor: ${currentPage >= totalPages ? 'not-allowed' : 'pointer'}; font-weight: bold;">
                                Next →
                            </button>
                        </div>
                    `;
                })
                .catch(error => console.error('Error fetching videos:', error));
        }

        // 5. Helper function to flip pages
        function changePage(direction) {
            currentPage += direction;
            loadVideos();
        }

    // 6. Load videos immediately when the page opens
    loadVideos();

    // Automatically reload the videos every 15 seconds
    setInterval(loadVideos, 15000);
    </script>

</body>
</html>
